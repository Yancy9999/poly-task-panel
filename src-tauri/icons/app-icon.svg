<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- SpringBoot 风格图标：圆角方块绿底 #6DB33F + 白色电源符号 ⏻
       电源符号 = 顶部开口的圆环（270° 弧）+ 中央向上穿过开口的竖线 -->
  <rect width="1024" height="1024" rx="200" ry="200" fill="#6DB33F"/>

  <!-- 圆环：圆心 (512,512)，半径 265，描边 74。
       顶部留 90° 开口：从 315°（右上）顺时针经底部画到 225°（左上）。
       端点：315° -> (699.4, 324.6)；225° -> (324.6, 324.6)。
       large-arc=1（270°>180°），sweep=1（y-down 下顺时针，即经 6 点钟方向）。 -->
  <path d="M 699.4 324.6 A 265 265 0 1 1 324.6 324.6"
        fill="none" stroke="#ffffff" stroke-width="74" stroke-linecap="round"/>

  <!-- 中央竖线：从圆心附近向上穿过顶部开口，顶端略高出圆环外缘 -->
  <rect x="475" y="225" width="74" height="300" rx="37" fill="#ffffff"/>
</svg>
